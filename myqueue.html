<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QueueLess - My Queue</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#050505;
    color:#fff;
    min-height:100vh;
}

.top-bar{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    border-bottom:1px solid #222;
    background:#080808;
}

.page-title{
    font-size:25px;
    font-weight:bold;
    letter-spacing:2px;
}

.student-name{
    font-size:15px;
    margin-right:20px;
}

.top-right{
    display:flex;
    align-items:center;
    gap:20px;
}

.menu-button{
    background:#111;
    color:white;
    border:1px solid #333;
    border-radius:10px;
    width:42px;
    height:42px;
    font-size:22px;
    cursor:pointer;
}

.menu-button:hover{
    background:#1b1b1b;
}

.menu-box{
    display:none;
    position:absolute;
    right:25px;
    top:65px;
    background:#111;
    border:1px solid #333;
    border-radius:10px;
    padding:10px;
    z-index:20;
}

.menu-box button{
    background:#181818;
    border:1px solid #333;
    color:white;
    padding:10px 20px;
    border-radius:8px;
    cursor:pointer;
}

.queue-header{
    text-align:center;
    padding:45px 20px 25px;
}

.queue-header h1{
    font-size:38px;
    margin-bottom:10px;
}

.queue-header p{
    color:#999;
    font-size:16px;
}

main{
    width:90%;
    max-width:1100px;
    margin:0 auto;
    padding-bottom:50px;
}

#queue-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:25px;
}

.queue-card{
    background:#0d0d0d;
    border:1px solid #292929;
    border-radius:18px;
    padding:28px;
    box-shadow:0 0 25px rgba(255,255,255,0.03);
}

.queue-card.your-turn{
    border:1px solid #555;
    box-shadow:0 0 25px rgba(255,255,255,0.08);
}

.service-name{
    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;
}

.your-turn-message{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    padding:12px;
    margin-bottom:15px;
}

.queue-number{
    text-align:center;
    font-size:58px;
    font-weight:bold;
    letter-spacing:2px;
    margin:20px 0 25px;
}

.queue-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.info-box{
    background:#151515;
    border:1px solid #282828;
    border-radius:12px;
    padding:15px;
}

.info-box span{
    display:block;
    color:#888;
    font-size:12px;
    margin-bottom:7px;
}

.info-box strong{
    font-size:16px;
}

.status{
    margin-top:18px;
    color:#aaa;
    line-height:1.5;
}

.leave{
    width:100%;
    margin-top:20px;
    padding:13px;
    background:#111;
    color:white;
    border:1px solid #444;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.leave:hover{
    background:#1c1c1c;
}

.empty-box,
.loading-box,
.error-box{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    background:#0d0d0d;
    border:1px solid #292929;
    border-radius:18px;
}

.empty-box h2,
.error-box h2{
    margin-bottom:12px;
}

.empty-box p,
.error-box p{
    color:#888;
}

.join-button{
    margin-top:20px;
    padding:12px 25px;
    background:#151515;
    color:white;
    border:1px solid #444;
    border-radius:10px;
    cursor:pointer;
}

@media(max-width:600px){

    .top-bar{
        padding:0 15px;
    }

    .student-name{
        display:none;
    }

    .queue-header h1{
        font-size:30px;
    }

    .queue-number{
        font-size:48px;
    }

    .queue-info{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header class="top-bar">

    <div class="page-title">
        QUEUELESS
    </div>

    <div class="top-right">

        <div class="student-name">
            Welcome, <span id="studentName"></span>
        </div>

        <button
            class="menu-button"
            onclick="toggleMenu()">
            ☰
        </button>

        <div
            id="menu"
            class="menu-box">

            <button onclick="logout()">
                Logout
            </button>

        </div>

    </div>

</header>


<section class="queue-header">

    <h1>
        My Queue
    </h1>

    <p>
        Track your active college service queues
    </p>

</section>


<main>

    <div id="queue-container">

        <div class="loading-box">
            Loading your queues...
        </div>

    </div>

</main>


<script>

const API_URL = window.location.origin;


/* =========================================
   STUDENT DATA
========================================= */

const studentData =
    JSON.parse(
        localStorage.getItem("student") || "{}"
    );

const STUDENT_ID =
    Number(
        localStorage.getItem("studentId") ||
        localStorage.getItem("student_id") ||
        studentData.student_id ||
        studentData.id ||
        0
    );

const STUDENT_NAME =
    localStorage.getItem("studentName") ||
    studentData.full_name ||
    studentData.name ||
    "Student";


document.getElementById("studentName").textContent =
    STUDENT_NAME;


/* =========================================
   LOGIN CHECK
========================================= */

if (!STUDENT_ID) {

    alert("Please login first.");

    window.location.href =
        "index.html";
}


/* =========================================
   MENU
========================================= */

function toggleMenu(){

    const menu =
        document.getElementById("menu");

    if(menu.style.display === "block"){

        menu.style.display = "none";

    }else{

        menu.style.display = "block";
    }
}


/* =========================================
   LOGOUT
========================================= */

function logout(){

    localStorage.removeItem("student");
    localStorage.removeItem("studentName");
    localStorage.removeItem("studentId");
    localStorage.removeItem("student_id");

    window.location.href =
        "index.html";
}


/* =========================================
   LOAD QUEUES
========================================= */

async function loadQueues(){

    const container =
        document.getElementById(
            "queue-container"
        );

    try{

        const response =
            await fetch(
                API_URL +
                "/api/my-queues/" +
                STUDENT_ID +
                "?t=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Unable to load queues"
            );
        }


        const data =
            await response.json();


        console.log(
            "QUEUE DATA FROM BACKEND:",
            data
        );


        let queues = data;


        /*
            Support both possible backend formats:
            1. [ {...}, {...} ]
            2. { success:true, queues:[...] }
        */

        if(
            data &&
            !Array.isArray(data) &&
            Array.isArray(data.queues)
        ){

            queues = data.queues;
        }


        if(
            !Array.isArray(queues) ||
            queues.length === 0
        ){

            container.innerHTML = `

                <div class="empty-box">

                    <h2>
                        No Active Queues
                    </h2>

                    <p>
                        You are not currently
                        waiting in any queue.
                    </p>

                    <button
                        class="join-button"
                        onclick="goServices()">

                        JOIN A QUEUE

                    </button>

                </div>
            `;

            return;
        }


        container.innerHTML = "";


        queues.forEach(function(queue){

            /*
                IMPORTANT FIX

                Backend normally sends:
                queue.queue_number

                Some older versions send:
                your_queue_number

                This handles both.
            */

            const rawQueueNumber =
                queue.queue_number ??
                queue.your_queue_number ??
                queue.number ??
                queue.queueNumber ??
                null;


            const queueNumber =
                Number(rawQueueNumber);


            const displayQueueNumber =
                Number.isFinite(queueNumber) &&
                queueNumber > 0
                    ? "#" + queueNumber
                    : "#?";


            const serviceName =
                queue.service_name ||
                queue.serviceName ||
                "College Service";


            const serviceTime =
                queue.average_service_time ??
                queue.averageServiceTime ??
                queue.service_time ??
                0;


            const status =
                queue.status ||
                "WAITING";


            const peopleAhead =
                Number(
                    queue.people_ahead ??
                    queue.peopleAhead ??
                    0
                );


            const position =
                Number(
                    queue.position ??
                    (peopleAhead + 1)
                );


            const estimatedWait =
                Number(
                    queue.estimated_wait_minutes ??
                    queue.estimated_wait ??
                    0
                );


            const queueId =
                queue.queue_id ??
                queue.id;


            const card =
                document.createElement("div");


            card.className =
                "queue-card";


            if(status === "SERVING"){

                card.classList.add(
                    "your-turn"
                );


                card.innerHTML = `

                    <div class="service-name">
                        ${serviceName}
                    </div>

                    <div class="your-turn-message">
                        🔔 YOUR TURN!
                    </div>

                    <div class="queue-number">
                        ${displayQueueNumber}
                    </div>

                    <div class="queue-info">

                        <div class="info-box">

                            <span>
                                SERVICE TIME
                            </span>

                            <strong>
                                ${serviceTime}
                                min/person
                            </strong>

                        </div>

                        <div class="info-box">

                            <span>
                                STATUS
                            </span>

                            <strong>
                                SERVING
                            </strong>

                        </div>

                    </div>

                    <div class="status">

                        Please proceed to the
                        ${serviceName}.

                    </div>

                `;

            }

            else{

                card.innerHTML = `

                    <div class="service-name">
                        ${serviceName}
                    </div>

                    <div class="queue-number">
                        ${displayQueueNumber}
                    </div>

                    <div class="queue-info">

                        <div class="info-box">

                            <span>
                                SERVICE TIME
                            </span>

                            <strong>
                                ${serviceTime}
                                min/person
                            </strong>

                        </div>

                        <div class="info-box">

                            <span>
                                STATUS
                            </span>

                            <strong>
                                ${status}
                            </strong>

                        </div>

                        <div class="info-box">

                            <span>
                                PEOPLE AHEAD
                            </span>

                            <strong>
                                ${peopleAhead}
                            </strong>

                        </div>

                        <div class="info-box">

                            <span>
                                POSITION
                            </span>

                            <strong>
                                ${position}
                            </strong>

                        </div>

                    </div>

                    <div class="status">

                        Estimated wait:
                        ${estimatedWait} minutes

                    </div>

                    ${
                        queueId
                        ? `
                            <button
                                class="leave"
                                onclick="leaveQueue(${Number(queueId)})">

                                LEAVE QUEUE

                            </button>
                          `
                        : ""
                    }

                `;
            }


            container.appendChild(card);

        });

    }

    catch(error){

        console.error(
            "QUEUE LOAD ERROR:",
            error
        );


        container.innerHTML = `

            <div class="error-box">

                <h2>
                    Cannot Connect
                </h2>

                <p>
                    Make sure Flask is running
                    on port 5000.
                </p>

            </div>
        `;
    }
}


/* =========================================
   LEAVE QUEUE
========================================= */

async function leaveQueue(queueId){

    if(
        !confirm(
            "Are you sure you want to leave this queue?"
        )
    ){

        return;
    }


    try{

        const response =
            await fetch(
                API_URL +
                "/api/leave/" +
                queueId,
                {
                    method:"DELETE"
                }
            );


        const data =
            await response.json();


        if(data.success){

            alert(
                "You left the queue."
            );

            loadQueues();

        }else{

            alert(
                data.message ||
                "Unable to leave queue."
            );
        }

    }

    catch(error){

        console.error(error);

        alert(
            "Cannot connect to QueueLess server."
        );
    }
}


/* =========================================
   GO TO SERVICES
========================================= */

function goServices(){

    window.location.href =
        "services.html";
}


/* =========================================
   START
========================================= */

loadQueues();


/*
   Refresh every 3 seconds
*/

setInterval(
    loadQueues,
    3000
);

</script>

</body>
</html>
